<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Sá</title>
    <link rel="stylesheet" href="style.css?v=5">
    <link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&display=swap" rel="stylesheet">
</head>
<body>

    <div class="game-container" id="gameArea">

        <div class="center-stage">
            <img src="img/casal.gif" alt="Nós" class="dancing-couple">

            <div class="spinning-heart-container">
                <svg viewBox="0 0 600 600" class="trembling-svg">
                    <defs>
                        <path id="heartPath" d="M300,150 C190,30 50,150 50,280 C50,450 300,550 300,550 C300,550 550,450 550,280 C550,150 410,30 300,150 Z" />
                    </defs>
                    <use href="#heartPath" class="sewing-thread-line" />
                </svg>
            </div>
        </div>

        <div class="char-wrapper mickey-wrapper">
            <img src="img/mickey.gif" class="char-img">
        </div>

        <div class="char-wrapper minnie-wrapper">
            <img src="img/minnie.gif" class="char-img">
        </div>

        <div class="char-wrapper donald-wrapper">
            <img src="img/donald.gif" class="char-img">
        </div>

        <div class="char-wrapper pluto-wrapper">
            <img src="img/pluto.gif" class="char-img">
        </div>

    </div>

    <div id="polaroidModal" class="modal hidden">
        <div class="polaroid-frame">
            <div class="photo-crop">
                <img id="polaroidImage" src="" alt="Momento">
            </div>
            <p id="polaroidDate" class="chalk-text">Nossos momentos...</p>
        </div>
    </div>

    <script src="script.js?v=5"></script>
</body>
</html>
