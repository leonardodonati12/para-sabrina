<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Sá</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Indie+Flower&display=swap" rel="stylesheet">
</head>
<body>

    <div class="game-container" id="gameArea">

        <div class="center-piece">
            <div class="stitched-heart"></div>
            <div class="couple-orbit">
                <img src="img/casal-desenho.png" alt="Nós" class="couple-img">
            </div>
        </div>

        <img src="img/mickey.png" class="disney-char bottom-left" id="charLeft">
        <img src="img/minnie.png" class="disney-char bottom-right" id="charRight">

    </div>

    <div id="polaroidModal" class="modal hidden">
        <div class="polaroid-frame">
            <img id="polaroidImage" src="" alt="Momento">
            <p id="polaroidDate" class="handwritten-text">Nossos momentos...</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
