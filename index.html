<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Sá</title>
    <link rel="stylesheet" href="style.css?v=2">
    <link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&display=swap" rel="stylesheet">
</head>
<body>

    <div class="game-container" id="gameArea">

        <div class="center-stage">
            <img src="img/21da2058de70b449337e0a7069efc0dc.gif" alt="Nós" class="dancing-couple">

            <div class="spinning-heart-container">
                <svg viewBox="0 0 600 600" class="trembling-svg">
                    <defs>
                        <path id="heartPath" d="M300,150 C190,30 50,150 50,280 C50,450 300,550 300,550 C300,550 550,450 550,280 C550,150 410,30 300,150 Z" />
                    </defs>
                    <use href="#heartPath" class="sewing-thread-line" />
                </svg>
            </div>
        </div>

        <img src="img/ceb93082e7d2d82c92c9e8d3596495a9.gif" class="disney-char move-l-to-r mickey-style">

        <div class="minnie-wrapper minnie-style">
            <img src="img/5706537e2eabdad10a00fa8b1f2cd40e.gif" class="disney-char-static">
        </div>

        <img src="img/donald-duck-run.gif" class="disney-char move-r-to-l donald-style">

        <img src="img/x_pluto1.gif" class="disney-char move-r-to-l pluto-style">

    </div>

    <div id="polaroidModal" class="modal hidden">
        <div class="polaroid-frame">
            <div class="photo-crop">
                <img id="polaroidImage" src="" alt="Momento">
            </div>
            <p id="polaroidDate" class="chalk-text">Nossos momentos...</p>
        </div>
    </div>

    <script src="script.js?v=2"></script>
</body>
</html>
